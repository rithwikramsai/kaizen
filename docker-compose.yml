services:
  postgres:
    image: postgres:16-alpine
    container_name: kiet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiet
      POSTGRES_PASSWORD: kiet_local
      POSTGRES_DB: kiet_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiet -d kiet_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: kiet_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
